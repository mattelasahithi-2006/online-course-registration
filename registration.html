
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Course Registration - LearnHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">
            <i class="bi bi-mortarboard-fill"></i>
            LearnHub
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="courses.html">
                        Courses
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="contact.html">
                        Contact
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       href="registration.html">
                        Register
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- HEADER -->
<section class="bg-light py-5">

    <div class="container text-center">

        <h1 class="fw-bold">
            Course Registration
        </h1>

        <p class="text-muted">
            Register for your preferred course
        </p>

    </div>

</section>

<!-- SUCCESS ALERT -->
<div class="container mt-4">

    <div id="successAlert"
         class="alert alert-success d-none">

        🎉 Registration Submitted Successfully!

    </div>

</div>

<!-- REGISTRATION FORM -->
<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    Student Registration Form

                </div>

                <div class="card-body">

                    <form id="registrationForm">

                        <!-- NAME -->
                        <div class="mb-3">

                            <label class="form-label">
                                Student Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   required>

                        </div>

                        <!-- EMAIL -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   required>

                        </div>

                        <!-- MOBILE -->
                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   required>

                        </div>

                        <!-- GENDER -->
                        <div class="mb-3">

                            <label class="form-label">
                                Gender
                            </label>

                            <select class="form-select"
                                    required>

                                <option value="">
                                    Select Gender
                                </option>

                                <option>
                                    Male
                                </option>

                                <option>
                                    Female
                                </option>

                                <option>
                                    Other
                                </option>

                            </select>

                        </div>

                        <!-- COURSE -->
                        <div class="mb-3">

                            <label class="form-label">
                                Course Selection
                            </label>

                            <select class="form-select"
                                    required>

                                <option value="">
                                    Select Course
                                </option>

                                <option>
                                    Web Development
                                </option>

                                <option>
                                    Python Programming
                                </option>

                                <option>
                                    Data Science
                                </option>

                                <option>
                                    AI & Machine Learning
                                </option>

                                <option>
                                    Java Programming
                                </option>

                                <option>
                                    Cloud Computing
                                </option>

                            </select>

                        </div>

                        <!-- QUALIFICATION -->
                        <div class="mb-3">

                            <label class="form-label">
                                Qualification
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="B.Tech, Degree, Intermediate"
                                   required>

                        </div>

                        <!-- ADDRESS -->
                        <div class="mb-3">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea class="form-control"
                                      rows="4"
                                      required></textarea>

                        </div>

                        <!-- RESUME -->
                        <div class="mb-3">

                            <label class="form-label">
                                Upload Resume
                            </label>

                            <input type="file"
                                   class="form-control">

                        </div>

                        <!-- TERMS -->
                        <div class="form-check mb-4">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="terms"
                                   required>

                            <label class="form-check-label"
                                   for="terms">

                                I agree to the Terms &
                                Conditions

                            </label>

                        </div>

                        <!-- BUTTONS -->
                        <button type="submit"
                                class="btn btn-primary">

                            Submit Registration

                        </button>

                        <button type="reset"
                                class="btn btn-secondary">

                            Reset

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- FOOTER -->
<footer class="bg-dark text-white py-4">

    <div class="container text-center">

        <p>
            📍 Hyderabad, Telangana, India
        </p>

        <p>
            📞 +91 9876543210 |
            ✉ info@learnhub.com
        </p>

        <p class="mb-0">
            © 2026 LearnHub Training Institute
        </p>

    </div>

</footer>

<!-- JS -->
<script>
document.getElementById("registrationForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    document.getElementById("successAlert")
    .classList.remove("d-none");

    this.reset();

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
